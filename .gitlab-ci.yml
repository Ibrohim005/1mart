# Проверки для каждой ветки и merge request.
# Playwright ставим из готового образа — иначе каждый прогон тянет браузеры.

stages: [quality, test, build]

# eslint 9.39 (via eslint-flat-config-utils) calls Object.groupBy, which
# only exists on Node 21+. Node 20 made `npm run lint` crash on config load.
default:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  NUXT_TELEMETRY_DISABLED: '1'

# --- Качество кода --------------------------------------------------------

lint:
  stage: quality
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

typecheck:
  stage: quality
  script:
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

icons:
  stage: quality
  script:
    # Имя иконки в разметке должно совпадать с файлом: при промахе
    # UiIcon молча рисует пустоту
    - npm run test:icons
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# --- Тесты ----------------------------------------------------------------

e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    # Playwright сам поднимет собранное приложение — см. webServer в конфиге
    CI: 'true'
  script:
    - npm run test:e2e -- --project=desktop-1440
  timeout: 30m
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'

# --- Сборка ---------------------------------------------------------------

build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - apps/host/.output/
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
